name: Daily Stock Update

on:
  schedule:
    - cron: '0 22 * * 1-5'  # runs 6pm EST every weekday
  workflow_dispatch:          # also lets you run it manually

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch financials
        run: python scripts/fetch_financials.py

      - name: Calculate ratios
        run: python scripts/calculate_ratios.py

      - name: Score stocks
        run: python scripts/score_stocks.py

      - name: Compare ratios
        run: python scripts/compare_ratios.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Daily update $(date +'%Y-%m-%d')" || echo "No changes"
          git push
